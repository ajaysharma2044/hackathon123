name: agentic-research-tests
on:
  push:
    branches: [codex/agentic-research-refactor]
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/agentic-research.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=engine pytest -q engine/test_agent_os_lifecycle.py engine/test_research_contracts.py engine/test_web_research.py engine/test_capture.py
